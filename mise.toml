[tools]
bun = "1.4.2"
node = "24.15.0"
terraform = "1.17.0"
java = "openjdk-25.0.2"

[tasks.setup]
description = "의존성과 저장소 Git hooks 설정"
run = "bun run setup"

[tasks."api:dev"]
description = "로컬 API 실행"
run = "bun run api:dev"

[tasks."api:check"]
description = "포맷·Worker 환경 타입·workerd 테스트·빌드 검사"
run = "bun run api:check"

[tasks."api:types"]
description = "Wrangler 설정에서 Worker 환경 타입 생성"
run = "bun run api:types"

[tasks."api:db:migrate"]
description = "로컬 D1 마이그레이션 적용"
run = "bun run api:db:migrate"

[tasks."android:check"]
description = "Android 포맷·lint·단위 테스트·debug 빌드"
run = "bun run android:check"

[tasks.check]
description = "API·Android·Terraform 전체 검사"
run = "bun run check"

[tasks."infra:check"]
description = "Cloudflare 리소스 접근 없이 Terraform 포맷과 provider 스키마 검사"
run = "bun run infra:check"
