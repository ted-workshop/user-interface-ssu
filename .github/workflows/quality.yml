name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: bun
      - run: bun install --frozen-lockfile
      - run: mise run api:check

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # 기본값의 tools 패키지는 SDK 저장소에서 더 이상 제공하지 않아요.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - run: mise run android:check

  quality:
    if: always()
    needs: [api, android]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          API_RESULT: ${{ needs.api.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: test "$API_RESULT" = success && test "$ANDROID_RESULT" = success
