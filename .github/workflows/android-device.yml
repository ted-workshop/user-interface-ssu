name: Android device

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-device.yml'
      - 'mise.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  common:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: bun java
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          cmdline-tools-version: '15859902'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: 에뮬레이터 실행 라이브러리 설치
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpulse0
      - name: 검사용 SDK와 가상 기기 준비
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
          avdmanager create avd --name qletter --package "system-images;android-35;google_apis;x86_64" --device pixel_7 <<< no
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: 기기 테스트와 상태별 화면 수집
        timeout-minutes: 18
        env:
          ANDROID_SERIAL: emulator-5554
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/qletter-device"
          mkdir -p "$evidence"
          printf 'PR HEAD: %s\nCheckout: %s\nAPI: 35\nProfile: Pixel 7\nData: device-local MockWebServer\n' "$PR_HEAD_SHA" "$(git rev-parse HEAD)" > "$evidence/environment.txt"
          "$ANDROID_HOME/emulator/emulator" -version >> "$evidence/environment.txt" 2>&1
          collect() {
            # 실패한 검사도 원래 종료 코드를 유지하고 화면·로그를 남겨요.
            result=$?
            trap - EXIT
            timeout 20s adb pull /sdcard/Android/data/kr.ac.ssu.qletter.debug/files/home-summary-check "$evidence/" || true
            timeout 20s adb pull /sdcard/Android/data/kr.ac.ssu.qletter.debug/files/report-check "$evidence/" || true
            timeout 20s adb logcat -d > "$evidence/logcat.txt" 2>&1 || true
            timeout 10s adb emu kill || true
            exit "$result"
          }
          trap collect EXIT
          "$ANDROID_HOME/emulator/emulator" -avd qletter -port 5554 -accel on -no-window -gpu swiftshader -no-snapshot -no-audio -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2 > "$evidence/emulator.txt" 2>&1 &
          timeout 600s bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; do sleep 2; done'
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          mise exec -- apps/android/gradlew -p apps/android connectedDebugAndroidTest -Pqletter.apiBaseUrl=http://127.0.0.1:3000/ -Pandroid.testInstrumentationRunnerArguments.package=kr.ac.ssu.qletter.common -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true
      - name: 생략된 검사와 누락된 화면 확인
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path('apps/android/app/build/outputs/androidTest-results/connected').rglob('TEST-*.xml'))
          if not reports:
              raise SystemExit('기기 검사 결과 XML이 없어요.')
          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.get(key, '0'))
          if not totals['tests'] or any(totals[key] for key in ('failures', 'errors', 'skipped')):
              raise SystemExit(f'기기 검사가 모두 실행·통과하지 않았어요: {totals}')
          images = {path.stem for path in (Path(os.environ['RUNNER_TEMP']) / 'qletter-device').rglob('*.png')}
          required = {'home-success', 'home-error', 'home-check-completed', 'summary-initial', 'summary-queued', 'summary-completed', 'summary-failed', 'summary-read-error', 'summary-retry', 'reports-list', 'report-detail', 'reports-empty', 'reports-no-matches', 'reports-error', 'reports-retry-success', 'reports-collections', 'report-no-access', 'reports-loading', 'reports-signed-out'}
          if required - images:
              raise SystemExit(f'빠진 화면: {sorted(required - images)}')
          print(f'기기 검사 결과: {totals}, 필수 화면 {len(required)}개 확인')
          PY
      - name: 검사 결과와 실제 에뮬레이터 화면 보관
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-device-api35-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/qletter-device/
            apps/android/app/build/outputs/androidTest-results/connected/
            apps/android/app/build/reports/androidTests/connected/
