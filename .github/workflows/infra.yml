name: Terraform Infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "인프라 plan만 확인하거나 해당 실행의 plan을 적용해요"
        type: choice
        options: [plan, apply]
        default: plan
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: qletter-production
  cancel-in-progress: false

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      TF_IN_AUTOMATION: "true"
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: bun terraform
      - name: Require successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          RELEASE_SHA="$(git rev-parse HEAD)"
          export RELEASE_SHA
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?branch=main&event=push&head_sha=$RELEASE_SHA&per_page=1" > "$RUNNER_TEMP/quality-runs.json"
          mise exec -- bun scripts/release.ts check "$RUNNER_TEMP/quality-runs.json"
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]
          [[ "$TF_STATE_BUCKET" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]]
      - run: mise run infra:check
      - name: Plan infrastructure against shared R2 state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mise exec -- terraform -chdir=infra/cloudflare init -input=false -lockfile=readonly -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="endpoints={s3=\"https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com\"}"
          mise exec -- terraform -chdir=infra/cloudflare plan -input=false -lock-timeout=60s -out="$RUNNER_TEMP/infra.tfplan"
      - name: Apply this run's saved plan
        if: inputs.operation == 'apply'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mise exec -- terraform -chdir=infra/cloudflare apply -input=false -lock-timeout=60s "$RUNNER_TEMP/infra.tfplan"
          mise exec -- terraform -chdir=infra/cloudflare output -json > "$RUNNER_TEMP/infra-outputs.json"
          jq -r '"Infrastructure applied\n\nCLOUDFLARE_D1_DATABASE_ID: `" + .database_id.value + "`\n\nWorker: `" + .worker_name.value + "`"' "$RUNNER_TEMP/infra-outputs.json" >> "$GITHUB_STEP_SUMMARY"
