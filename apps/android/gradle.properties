# 프로젝트 전체의 Gradle 설정이에요.
# Android Studio 등 IDE에서 지정한 Gradle 설정이 이 파일보다 우선해요.
# 빌드 환경 설정 문서예요.
# 참고 문서: http://www.gradle.org/docs/current/userguide/build_environment.html
# 데몬 프로세스의 JVM 인자로 메모리 등을 조정해요.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 아래 옵션을 켜면 실험적인 병렬 모드로 실행해요. 서로 독립적인 프로젝트에서만 사용해요.
# 프로젝트 분리 조건 문서예요.
# 참고 문서: https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# 병렬 모드 설정 예시: org.gradle.parallel=true
# 구성 캐시를 켜면 빌드 스크립트 등 설정에 영향을 주는 변경이 없을 때 구성 단계를 건너뛰어요.
# 작업 실행에도 성능 최적화를 적용해요.
org.gradle.configuration-cache=true

org.gradle.java.installations.fromEnv=JAVA_HOME
